[package]
name = "chimera_rack"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
chimera = { path = "../../engine/crates/chimera" }
flate2 = "1" # the pronouncing dictionary is embedded gzipped

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"   # panics are caught at the C boundary, never cross into Rack
