# Builds Phona for Windows (win-x64), Linux (lin-x64) and Intel Macs (mac-x64) on GitHub's machines.
# (mac-arm64 is built and notarized on Rob's Mac.)
# The finished .vcvplugin files are under "Artifacts" on the run's page in the Actions tab.
# These builds are unsigned test builds, not releases.
name: Build

on:
  push:
    paths:
      - 'rack-plugin/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.6
  # The engine: upstream chimera-vocal-synth at the pinned commit, plus rack-plugin/engine-fork.patch
  ENGINE_REPO: https://github.com/jamesondh/chimera-vocal-synth
  ENGINE_COMMIT: 092b16ce12b927d473c884ca2dfae53ce1b995df

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-gnu
            container: ''
          - platform: lin-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          # Cross-built on an Apple Silicon runner; the tests run through Rosetta
          - platform: mac-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Libraries that libRack.so needs, for the tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libgl1 libx11-6 libasound2t64 libjack-jackd2-0 libpulse0

      - name: Rosetta, to run the Intel tests (Mac)
        if: runner.os == 'macOS'
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true && echo "Rosetta works"
          command -v zstd >/dev/null && command -v jq >/dev/null || brew install zstd jq

      # Windows: keep LF line endings, or the engine patch does not apply
      - name: Git line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Engine (upstream + fork patch)
        run: |
          git init -q engine
          git -C engine fetch -q --depth 1 "$ENGINE_REPO" "$ENGINE_COMMIT"
          git -C engine checkout -q FETCH_HEAD
          git -C engine apply ../rack-plugin/engine-fork.patch

      - name: Rack SDK
        run: |
          mkdir -p sdk
          curl -fsSL -o sdk/sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip"
          unzip -q sdk/sdk.zip -d sdk

      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
          rustc --version

      - name: MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit # so that make can find cargo
          update: true
          install: >-
            make tar zstd unzip
            mingw-w64-x86_64-gcc
            jq python

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: rack-plugin
        run: make -j4 dist

      # VCV: Linux plugins must need at most glibc 2.23 and libstdc++ 5.4.0. Ubuntu 16.04 has exactly
      # glibc 2.23 and gcc 5.4. Only the build runs in it: GitHub's own steps need a newer system.
      - name: Build (Linux, in Ubuntu 16.04)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/w -w /w/rack-plugin -e DEBIAN_FRONTEND=noninteractive ubuntu:16.04 bash -euo pipefail -c '
            apt-get update -q
            apt-get install -yq --no-install-recommends build-essential curl ca-certificates jq > /dev/null
            # The zstd of Ubuntu 16.04 is too old for the .vcvplugin format
            curl -fsSL https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz | tar -xz -C /tmp
            make -s -C /tmp/zstd-1.5.6/programs -j4 zstd > /dev/null && cp /tmp/zstd-1.5.6/programs/zstd /usr/local/bin/
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal > /dev/null
            . "$HOME/.cargo/env"
            gcc --version | sed -n 1p; ldd --version | sed -n 1p; rustc --version # sed reads all: head can stop the writer (SIGPIPE, exit 141)
            make -j4 dist'
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Check the Linux library versions
        if: runner.os == 'Linux'
        working-directory: rack-plugin
        run: |
          NEED=$(objdump -T plugin.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Newest glibc version the plugin needs: $NEED (VCV allows at most GLIBC_2.23)"
          [ "$(printf '%s\n' GLIBC_2.23 "$NEED" | sort -V | tail -1)" = GLIBC_2.23 ]
          # libstdc++ is linked into the plugin (plugin.mk), so it must need none from the system
          if objdump -T plugin.so | grep -E 'GLIBCXX_|CXXABI_'; then echo "Needs the system libstdc++"; exit 1; fi

      - name: Build (Mac Intel)
        if: runner.os == 'macOS'
        working-directory: rack-plugin
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          make -j4 dist CROSS_COMPILE=x86_64-apple-darwin
          lipo -archs dist/Spunoza/plugin.dylib
          [ "$(lipo -archs dist/Spunoza/plugin.dylib)" = x86_64 ]
          echo "Oldest macOS:"; otool -l dist/Spunoza/plugin.dylib | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -E 'minos|version'

      - uses: actions/upload-artifact@v4
        with:
          name: Phona-${{ matrix.platform }}
          path: rack-plugin/dist/*.vcvplugin
          if-no-files-found: error

      # ---------------------------------------------------------------- Tests (headless: no window, no audio device)
      # A copy of VCV Rack Free gives the tests libRack (Windows) and the Fundamental plugin (both).
      - name: Rack Free (for the tests)
        run: |
          mkdir -p rack
          if [ "$RUNNER_OS" = macOS ]; then
            curl -fsSL -o rack/RackFree.pkg "https://vcvrack.com/downloads/RackFree-${RACK_SDK_VERSION}-mac-x64+arm64.pkg"
            pkgutil --expand-full rack/RackFree.pkg rack/inst
            echo "Fundamental files in the package:"; find rack/inst -name 'Fundamental*'
            echo "FUNDAMENTAL=$PWD/$(find rack/inst -name 'Fundamental-*-mac-x64.vcvplugin' | head -1)" >> "$GITHUB_ENV"
            echo "RACK_PLUGINS=$PWD/rack/plugins" >> "$GITHUB_ENV"
            echo "CPU_NAME=$(sysctl -n machdep.cpu.brand_string) (Intel code through Rosetta)" >> "$GITHUB_ENV"
            exit 0
          elif [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL -o rack/RackFree.exe "https://vcvrack.com/downloads/RackFree-${RACK_SDK_VERSION}-win-x64.exe"
            7z x -y -orack/inst rack/RackFree.exe > /dev/null
            RUN=$(dirname "$(find rack/inst -name libRack.dll | head -1)")
            echo "RACK_RUN=$PWD/$RUN" >> "$GITHUB_ENV"
            echo "Files next to libRack.dll:"; ls "$RUN"
            echo "CPU_NAME=$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name')" >> "$GITHUB_ENV"
          else
            curl -fsSL -o rack/RackFree.zip "https://vcvrack.com/downloads/RackFree-${RACK_SDK_VERSION}-lin-x64.zip"
            unzip -q rack/RackFree.zip -d rack/inst
            echo "CPU_NAME=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')" >> "$GITHUB_ENV"
          fi
          echo "FUNDAMENTAL=$PWD/$(find rack/inst -name 'Fundamental-*.vcvplugin' | head -1)" >> "$GITHUB_ENV"
          echo "RACK_PLUGINS=$PWD/rack/plugins" >> "$GITHUB_ENV"

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          mkdir -p rack/plugins && zstd -dc "$FUNDAMENTAL" | tar -x -C rack/plugins
          bash rack-plugin/tests/ci.sh

      - name: Tests (Linux, Mac)
        if: runner.os != 'Windows'
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          mkdir -p rack/plugins && zstd -dc "$FUNDAMENTAL" | tar -x -C rack/plugins
          bash rack-plugin/tests/ci.sh

      # The engine's own tests (83, with golden outputs) on x86. Same Rust code on Windows.
      - name: Engine tests
        if: runner.os == 'Linux'
        working-directory: engine
        run: cargo test --release -p chimera

      # Allocation on the audio thread. On macOS arm64 the beatbox path allocates (test fails, 2026-11-15);
      # on Linux x64 it passed. Not explained yet, so a failure here is a warning, not a build failure.
      - name: Known problem - beatbox allocates on the audio thread
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: rack-plugin/rust
        run: cargo test --release --lib alloc_test::audio_path_does_not_allocate
